[build-system]
requires = ["setuptools>=83,<84"]
build-backend = "setuptools.build_meta"

[project]
name = "vao-cli"
version = "0.3.0"
description = "Reference command-line client for resolving, validating, and selectively acquiring Virtual Acoustic Objects"
readme = "README.md"
requires-python = ">=3.11"
license = "Apache-2.0"
authors = [{name = "Dominik Ukolov"}]
maintainers = [{name = "Dominik Ukolov"}]
keywords = [
  "virtual acoustic object",
  "digital preservation",
  "research data",
  "acoustics",
  "musical instruments",
  "zenodo",
]
classifiers = [
  "Development Status :: 3 - Alpha",
  "Environment :: Console",
  "Intended Audience :: Science/Research",
  "Operating System :: OS Independent",
  "Programming Language :: Python :: 3",
  "Programming Language :: Python :: 3 :: Only",
  "Programming Language :: Python :: 3.11",
  "Programming Language :: Python :: 3.12",
  "Programming Language :: Python :: 3.13",
  "Programming Language :: Python :: 3.14",
  "Topic :: Scientific/Engineering :: Information Analysis",
]
dependencies = [
  "jsonschema[format]>=4.26,<5",
  "rfc8785>=0.1,<1",
]

[project.optional-dependencies]
dev = [
  "build>=1.3,<2",
  "pytest>=8,<10",
  "ruff>=0.16,<1",
  "setuptools>=83,<84",
  "twine>=6,<7",
  "wheel>=0.45,<1",
]

[project.urls]
Homepage = "https://modavis-project.github.io/vao-cli/"
Documentation = "https://modavis-project.github.io/vao-cli/"
Repository = "https://github.com/modavis-project/vao-cli"
Issues = "https://github.com/modavis-project/vao-cli/issues"
DOI = "https://doi.org/10.5281/zenodo.22133810"
Standard = "https://doi.org/10.5281/zenodo.22122774"

[project.scripts]
vao = "vao_cli.cli:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-ra --strict-config --strict-markers"

[tool.ruff]
target-version = "py311"
line-length = 88

[tool.ruff.lint]
select = ["B", "E", "F", "I", "UP"]
ignore = ["E501"]
