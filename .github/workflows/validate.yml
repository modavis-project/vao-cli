name: Validate VAO CLI

on:
  workflow_call:
  push:
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: validate-${{ github.ref }}
  cancel-in-progress: true

jobs:
  release-gate:
    name: Python ${{ matrix.python-version }}
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.11", "3.14"]
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          repository: modavis-project/vao-standard
          ref: v0.4.0
          path: _vendor/vao-standard
          fetch-depth: 0
          persist-credentials: false
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: ${{ matrix.python-version }}
          cache: pip
      - name: Install package and release tools
        run: |
          python -m pip install --disable-pip-version-check --require-hashes -r requirements-lock.txt
          python -m pip install --disable-pip-version-check --no-deps --no-build-isolation -e .
      - name: Verify the signed VAO Standard release
        run: |
          printf '%s\n' 'modavis-project@users.noreply.github.com ssh-ed25519 AAAAC3NzaC1lZDI1NTE5AAAAIC0hRn2syRAD3vCm9MLm766FprDF3GfVMVmj5C2wYPkk' > "$RUNNER_TEMP/vao-standard-allowed-signers"
          git -C _vendor/vao-standard -c gpg.ssh.allowedSignersFile="$RUNNER_TEMP/vao-standard-allowed-signers" verify-tag v0.4.0
          test "$(tr -d '\n' < _vendor/vao-standard/VERSION)" = "0.4.0"
      - name: Run the release gate
        env:
          VAO_STANDARD_ROOT: ${{ github.workspace }}/_vendor/vao-standard
        run: python tools/check_release.py
